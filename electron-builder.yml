appId: io.deskpets.app
productName: DeskPets
directories:
  output: dist
files:
  - src/**
  - assets/**
  - package.json
extraResources:
  - from: src/windows
    to: windows
win:
  target:
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
portable:
  artifactName: DeskPets-${version}-portable.exe
mac:
  target:
    - target: zip
      arch:
        - arm64
        - x64
  icon: assets/icon.icns
  identity: null
  extraResources:
    - from: build/mac
      to: mac
    - from: resources/initial-data
      to: petsdata
